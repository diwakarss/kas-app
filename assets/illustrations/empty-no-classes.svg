<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Empty State: No Classes Today -->
  <!-- Style: Warm, organic, "Liquid Story" philosophy -->

  <!-- Soft background circle -->
  <circle cx="100" cy="100" r="80" fill="#FAF7F2" stroke="#B8AFA6" stroke-width="2" stroke-dasharray="8 4"/>

  <!-- Calendar page (tilted slightly for organic feel) -->
  <g transform="translate(60, 50) rotate(-3)">
    <!-- Calendar body -->
    <rect x="0" y="0" width="80" height="90" rx="8" fill="white" stroke="#B8AFA6" stroke-width="2"/>
    <!-- Calendar header -->
    <rect x="0" y="0" width="80" height="24" rx="8" fill="#0D47A1" opacity="0.2"/>
    <rect x="0" y="16" width="80" height="8" fill="white"/>
    <!-- Calendar rings -->
    <circle cx="20" cy="4" r="3" fill="#B8AFA6"/>
    <circle cx="40" cy="4" r="3" fill="#B8AFA6"/>
    <circle cx="60" cy="4" r="3" fill="#B8AFA6"/>
    <!-- Empty day squares (showing nothing scheduled) -->
    <rect x="10" y="35" width="12" height="12" rx="2" fill="#FAF7F2" stroke="#B8AFA6" stroke-width="1"/>
    <rect x="28" y="35" width="12" height="12" rx="2" fill="#FAF7F2" stroke="#B8AFA6" stroke-width="1"/>
    <rect x="46" y="35" width="12" height="12" rx="2" fill="#FAF7F2" stroke="#B8AFA6" stroke-width="1"/>
    <rect x="10" y="55" width="12" height="12" rx="2" fill="#FAF7F2" stroke="#B8AFA6" stroke-width="1"/>
    <rect x="28" y="55" width="12" height="12" rx="2" fill="#FAF7F2" stroke="#B8AFA6" stroke-width="1"/>
    <rect x="46" y="55" width="12" height="12" rx="2" fill="#FAF7F2" stroke="#B8AFA6" stroke-width="1"/>
  </g>

  <!-- Coffee cup (suggesting a break) -->
  <g transform="translate(115, 120)">
    <!-- Cup body -->
    <path d="M10 0 L5 35 Q5 45 20 45 Q35 45 35 35 L30 0 Z" fill="white" stroke="#3D3530" stroke-width="2" stroke-linecap="round"/>
    <!-- Cup handle -->
    <path d="M30 10 Q45 10 45 22 Q45 34 30 34" fill="none" stroke="#3D3530" stroke-width="2" stroke-linecap="round"/>
    <!-- Steam wisps -->
    <path d="M12 -5 Q15 -15 12 -20" fill="none" stroke="#B8AFA6" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M20 -8 Q23 -18 20 -25" fill="none" stroke="#B8AFA6" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M28 -5 Q25 -15 28 -20" fill="none" stroke="#B8AFA6" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Small decorative leaf (organic touch) -->
  <g transform="translate(45, 145)">
    <path d="M0 15 Q5 5 15 0 Q10 10 12 20 Q5 15 0 15" fill="#5A8B67" opacity="0.6"/>
    <path d="M7 8 L12 18" fill="none" stroke="#5A8B67" stroke-width="1" opacity="0.8"/>
  </g>
</svg>
