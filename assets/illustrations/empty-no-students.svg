<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Empty State: No Students Yet -->
  <!-- Style: Warm, welcoming, inviting to add first student -->

  <!-- Soft background circle -->
  <circle cx="100" cy="100" r="80" fill="#FAF7F2" stroke="#B8AFA6" stroke-width="2" stroke-dasharray="8 4"/>

  <!-- Empty chair (welcoming, waiting for someone) -->
  <g transform="translate(55, 55)">
    <!-- Chair back -->
    <rect x="15" y="0" width="60" height="8" rx="4" fill="#D4845A" opacity="0.7"/>
    <rect x="18" y="8" width="6" height="40" rx="2" fill="#D4845A" opacity="0.6"/>
    <rect x="66" y="8" width="6" height="40" rx="2" fill="#D4845A" opacity="0.6"/>
    <!-- Chair seat -->
    <rect x="10" y="48" width="70" height="12" rx="4" fill="#D4845A" opacity="0.8"/>
    <!-- Chair legs -->
    <rect x="15" y="60" width="6" height="35" rx="2" fill="#3D3530" opacity="0.5"/>
    <rect x="69" y="60" width="6" height="35" rx="2" fill="#3D3530" opacity="0.5"/>
  </g>

  <!-- Graduation cap floating above (suggesting potential) -->
  <g transform="translate(100, 35)">
    <!-- Cap top -->
    <polygon points="0,-5 -25,5 0,15 25,5" fill="#3D3530" opacity="0.7"/>
    <!-- Cap base -->
    <ellipse cx="0" cy="5" rx="18" ry="6" fill="#3D3530" opacity="0.5"/>
    <!-- Tassel -->
    <line x1="0" y1="-5" x2="15" y2="0" stroke="#D4845A" stroke-width="2"/>
    <circle cx="15" cy="2" r="3" fill="#D4845A"/>
    <line x1="15" y1="5" x2="15" y2="20" stroke="#D4845A" stroke-width="2"/>
  </g>

  <!-- Sparkles (sense of possibility) -->
  <g fill="#0D47A1" opacity="0.6">
    <circle cx="50" cy="80" r="2"/>
    <circle cx="150" cy="70" r="2.5"/>
    <circle cx="145" cy="130" r="2"/>
    <circle cx="55" cy="140" r="1.5"/>
  </g>

  <!-- Plus sign (subtle CTA hint) -->
  <g transform="translate(160, 150)" opacity="0.4">
    <circle cx="0" cy="0" r="12" fill="#5A8B67"/>
    <line x1="-5" y1="0" x2="5" y2="0" stroke="white" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="-5" x2="0" y2="5" stroke="white" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
