<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Empty State: No Search Results -->
  <!-- Style: Friendly, not frustrating, suggests trying again -->

  <!-- Soft background circle -->
  <circle cx="100" cy="100" r="80" fill="#FAF7F2" stroke="#B8AFA6" stroke-width="2" stroke-dasharray="8 4"/>

  <!-- Magnifying glass -->
  <g transform="translate(60, 50)">
    <!-- Glass circle -->
    <circle cx="40" cy="40" r="35" fill="white" stroke="#5B8BA4" stroke-width="4"/>
    <!-- Inner reflection -->
    <path d="M25 30 Q30 20 45 25" fill="none" stroke="#5B8BA4" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
    <!-- Handle -->
    <line x1="65" y1="65" x2="90" y2="90" stroke="#3D3530" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Question mark inside glass (curious, not error) -->
  <g transform="translate(90, 75)" fill="#B8AFA6">
    <path d="M0 0 Q0 -15 10 -15 Q20 -15 20 -5 Q20 5 10 8 L10 15" fill="none" stroke="#B8AFA6" stroke-width="3" stroke-linecap="round"/>
    <circle cx="10" cy="22" r="2.5"/>
  </g>

  <!-- Floating dots suggesting "keep looking" -->
  <g fill="#D4845A" opacity="0.5">
    <circle cx="45" cy="130" r="4"/>
    <circle cx="60" cy="140" r="3"/>
    <circle cx="78" cy="145" r="2"/>
  </g>

  <!-- Small paper/document icon (suggesting what to search for) -->
  <g transform="translate(140, 120)" opacity="0.4">
    <rect x="0" y="0" width="25" height="32" rx="3" fill="white" stroke="#B8AFA6" stroke-width="1.5"/>
    <line x1="5" y1="8" x2="20" y2="8" stroke="#B8AFA6" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="5" y1="14" x2="18" y2="14" stroke="#B8AFA6" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="5" y1="20" x2="15" y2="20" stroke="#B8AFA6" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>
