# KAS App Backend - InsForge Configuration
# Wave 4: Delivery
#
# Usage:
#   docker compose up -d          # Start all services
#   docker compose logs -f        # View logs
#   docker compose down           # Stop all services
#
# Ports:
#   7130 - InsForge Dashboard
#   7131 - InsForge API
#   5432 - PostgreSQL (internal)
#   9000 - MinIO S3 API
#   9001 - MinIO Console

version: '3.8'

services:
  # InsForge - Backend-as-a-Service
  insforge:
    image: insforge/insforge:latest
    container_name: kas-insforge
    ports:
      - "7130:7130"  # Dashboard
      - "7131:7131"  # API
    environment:
      # Database
      - DATABASE_URL=postgresql://kas:kas_secret_dev@postgres:5432/kas_app

      # Authentication
      - AUTH_SECRET=${AUTH_SECRET:-kas-dev-secret-change-in-production}
      - AUTH_TOKEN_EXPIRY=7d
      - AUTH_REFRESH_TOKEN_EXPIRY=30d

      # OAuth Providers (optional - configure in production)
      - OAUTH_GOOGLE_CLIENT_ID=${OAUTH_GOOGLE_CLIENT_ID:-}
      - OAUTH_GOOGLE_CLIENT_SECRET=${OAUTH_GOOGLE_CLIENT_SECRET:-}
      - OAUTH_GITHUB_CLIENT_ID=${OAUTH_GITHUB_CLIENT_ID:-}
      - OAUTH_GITHUB_CLIENT_SECRET=${OAUTH_GITHUB_CLIENT_SECRET:-}

      # Email Auth
      - AUTH_EMAIL_ENABLED=true
      - AUTH_EMAIL_CONFIRM_REQUIRED=false  # Set true in production

      # S3-Compatible Storage (MinIO)
      - STORAGE_BACKEND=s3
      - STORAGE_S3_ENDPOINT=http://minio:9000
      - STORAGE_S3_BUCKET=kas-storage
      - STORAGE_S3_ACCESS_KEY=${MINIO_ROOT_USER:-kas-minio-dev}
      - STORAGE_S3_SECRET_KEY=${MINIO_ROOT_PASSWORD:-kas-minio-secret-dev}
      - STORAGE_S3_REGION=us-east-1

      # LLM Provider (for spec generation)
      - DEEPINFRA_API_KEY=${DEEPINFRA_API_KEY}

      # Rate Limiting (from CEO review decision 12A)
      - RATE_LIMIT_GENERATE_HOUR=10
      - RATE_LIMIT_GENERATE_DAY=100

      # Feature Flags
      - ENABLE_PROGRESS_SSE=true

      # Logging
      - LOG_LEVEL=info

      # CORS (for website)
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:7130}

    volumes:
      - ./functions:/app/functions
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7131/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: kas-postgres
    environment:
      - POSTGRES_USER=kas
      - POSTGRES_PASSWORD=kas_secret_dev
      - POSTGRES_DB=kas_app
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kas -d kas_app"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO - S3-Compatible Storage
  minio:
    image: minio/minio:latest
    container_name: kas-minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-kas-minio-dev}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-kas-minio-secret-dev}
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"  # S3 API
      - "9001:9001"  # Console
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # MinIO Setup - Create bucket on startup
  minio-setup:
    image: minio/mc:latest
    container_name: kas-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set kas http://minio:9000 kas-minio-dev kas-minio-secret-dev;
      mc mb kas/kas-storage --ignore-existing;
      mc anonymous set download kas/kas-storage/public;
      echo 'MinIO bucket created successfully';
      exit 0;
      "

volumes:
  postgres-data:
  minio-data:

networks:
  default:
    name: kas-network
